name: API PR Quality Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - '**'
jobs:
  get-affected:
    runs-on: ubuntu-latest
    outputs:
      affected_api: ${{ steps.set-application.outputs.affected_api }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Get affected api
        id: set-application
        run: |
          AFFECTED=$(npx nx show projects --exclude=*-root --affected --base=origin/main --head=HEAD |
            jq -R -s -c 'split("\n") | map(select(. != "" and test("api$")))')

          echo "affected_api={\"project\": $AFFECTED}" >> $GITHUB_OUTPUT

  lint-check:
    needs: get-affected
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.get-affected.outputs.affected_api) }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - run: |
          npm install
          npx nx install ${{ matrix.project }}

      - name: Run lint check
        run: npx nx lint ${{ matrix.project }}

  test:
    needs: get-affected
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.get-affected.outputs.affected_api) }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - run: |
          npm install
          npx nx install ${{ matrix.project }}

      # TODO: See how to handle this better. Maybe mocking every external API with MockServer.
      - name: Create .env file from GitHub Secret
        run: |
          echo "${{ secrets[format('{0}_ENV_FILE_CONTENTS', matrix.project)] }}" > ${{ matrix.project }}/.env

      - name: Run unit tests
        run: npx nx test ${{ matrix.project }}

  test-integration:
    needs: get-affected
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.get-affected.outputs.affected_api) }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Use NX 20 to fix issue with nx sqlite and integration tests
      - name: Install NX@20
        run: npm install nx@20.8.2 -g

      - name: Install dependencies
        run: |
          npm install
          ./nx install ${{ matrix.project }}

      # TODO: See how to handle this better. Maybe mocking every external API with MockServer.
      - name: Create .env file from GitHub Secret
        run: |
          echo "${{ secrets[format('{0}_ENV_FILE_CONTENTS', matrix.project)] }}" > ${{ matrix.project }}/.env

      - name: Run integration tests
        run: ./nx test:integration ${{ matrix.project }}
