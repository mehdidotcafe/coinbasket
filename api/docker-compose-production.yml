name: coinbasket_api_production
services:
  postgres_production:
    image: postgres:17.5
    container_name: postgres_production
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${APP_NAME}_${APP_ENV}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  qdrant_production:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant_production
    ports:
      - ${QDRANT_PORT}:6333
      - ${QDRANT_GRPC_PORT}:6334
    expose:
      - 6333
      - 6334
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-data:/qdrant/storage
configs:
  qdrant_config:
    content: |
      log_level: INFO
volumes:
  postgres-data:
  qdrant-data: