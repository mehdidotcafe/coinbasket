name: coinbasket_api_production
services:
  postgres_production:
    image: postgres:17.5
    container_name: postgres_production
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${APP_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  temporal_production:
    depends_on:
      - postgres_production
    container_name: temporal_production
    image: temporalio/auto-setup:1.29
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres_production
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PWD=${DATABASE_PASSWORD}
      - DBNAME=${APP_NAME}-temporal
      - VISIBILITY_DBNAME=${APP_NAME}-temporal-visibility
    ports:
      - "${TEMPORAL_PORT}:7233"
      - "8889:8233"
    volumes:
      - temporal-data:/tmp/temporal
  qdrant_production:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant_production
    ports:
      - ${QDRANT_PORT}:6333
      - ${QDRANT_GRPC_PORT}:6334
    expose:
      - 6333
      - 6334
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - qdrant-data:/qdrant/storage
configs:
  qdrant_config:
    content: |
      log_level: INFO
volumes:
  postgres-data:
  temporal-data:
  qdrant-data: