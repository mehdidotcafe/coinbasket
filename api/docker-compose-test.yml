name: coinbasket_api_test
services:
  anvil_test:
    image: ghcr.io/foundry-rs/foundry:v1.2.3
    container_name: anvil_test
    environment:
      ANVIL_IP_ADDR: "0.0.0.0"
    working_dir: /anvil
    ports:
      - "8546:8545"
    entrypoint: ["anvil"]
    command: [ "--balance", "10000", "--chain-id", "${ANVIL_CHAIN_ID}", "--fork-url", "${ANVIL_FORK_URL}", "--mnemonic", "${ANVIL_MNEMONIC}" ]
  postgres_test:
    image: postgres:17.5
    container_name: postgres_test
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${APP_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - /var/lib/postgresql/data
  temporal_test:
    container_name: temporal_test
    image: temporalio/temporal:1.5.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "${TEMPORAL_PORT}:7233"
    volumes:
      - /tmp/temporal
  qdrant_test:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant_test
    ports:
      - ${QDRANT_PORT}:6333
      - ${QDRANT_GRPC_PORT}:6334
    expose:
      - 6333
      - 6334
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - /qdrant/storage
configs:
  qdrant_config:
    content: |
      log_level: INFO