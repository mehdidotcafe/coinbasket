[tool.coverage.run]
branch = true
source = [ "api" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../coverage/api/html'
 --cov-report xml:'../coverage/api/coverage.xml'
 --html='../reports/api/unittests/html/index.html'
 --junitxml='../reports/api/unittests/junit.xml'
"""

[tool.poetry]
name = "api"
version = "0.0.1"
description = "🧺 coinbasket api"
authors = [ "mehdidotcafe" ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "api"

  [tool.poetry.dependencies]
  python = ">=3.10,<4.0"
  python-dotenv = ">=1.1.0,<2.0.0"
  langchain-openai = "^1.0.1"
  langchain-core = "^1.0.1"
  langgraph = "^1.0.1"
  web3 = ">=7.10.0,<8.0.0"
  environs = ">=14.1.1,<15.0.0"
  anyio = "^4.9.0"
  aiohttp = "^3.11.18"
  pydantic = "^2.11.5"
  apispec = "^6.8.2"
  async-lru = "^2.0.5"
  sqlalchemy = "^2.0.41"
  alembic = "^1.16.4"
  asyncpg = "^0.30.0"
  psycopg2-binary = "^2.9.10"
  langchain-qdrant = "^1.1.0"
  qdrant-client = "^1.14.2"
  langchain-mcp-adapters = "^0.1.13"
  fastapi = {extras = ["standard"], version = "^0.124.4"}
  siwe = "^4.4.0"
  pyjwt = "^2.10.1"
  langgraph-checkpoint-postgres = "^3.0.2"
  uvicorn = {extras = ["standard"], version = "^0.40.0"}
  gunicorn = "^23.0.0"
  psycopg = {extras = ["binary", "pool"], version = "^3.3.2"}
    [tool.poetry.dependencies.langchain]
    extras = [ "openai" ]
    version = "^1.0.2"

[tool.poetry.group.dev.dependencies]
eth-typing = "^5.2.1"
ruff = ">=0.11.4,<0.12.0"
syrupy = "^4.9.1"
pytest = "8.3.5"
pytest-sugar = "1.0.0"
pytest-cov = "6.0.0"
pytest-html = "4.1.1"
pytest-watch = "4.2.0"
pytest-asyncio = "^1.0.0"

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
