[tool.coverage.run]
branch = true
source = [ "shared" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../coverage/shared/html'
 --cov-report xml:'../coverage/shared/coverage.xml'
 --html='../reports/shared/unittests/html/index.html'
 --junitxml='../reports/shared/unittests/junit.xml'
"""

[tool.poetry]
name = "shared"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "shared"

  [tool.poetry.dependencies]
  python = ">=3.10,<4.0"
  pydantic = "^2.11.7"
  aiohttp = "^3.12.13"
  requests = "^2.32.4"

  [tool.poetry.group.dev.dependencies]
  pytest = "8.3.4"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
