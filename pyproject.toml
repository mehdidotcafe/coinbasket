[project]
name = "coinbasket"
version = "0.0.1"
description = "🧺 coinbasket"
authors = [
    {name = "mehdidotcafe",email = "contact@mehdi.cafe"}
]
license = {text = "GPL3"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "uagents (>=0.22.3,<0.23.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "ruff (>=0.11.4,<0.12.0)",
    "langchain[openapi] (>=0.3.23,<0.4.0)",
    "langchain-openai (>=0.3.12,<0.4.0)",
    "langchain-core (>=0.3.51,<0.4.0)",
    "langchain-community (>=0.3.21,<0.4.0)",
    "langgraph (>=0.3.30,<0.4.0)",
    "jq (>=1.8.0,<2.0.0)",
    "web3 (>=7.10.0,<8.0.0)",
    "environs (>=14.1.1,<15.0.0)",
    "uniswap-universal-router-decoder (>=2.0.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
coinbasket = "coinbasket:main"
[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-watch = "^4.2.0"

