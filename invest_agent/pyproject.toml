[tool.coverage.run]
branch = true
source = [ "invest_agent" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../coverage/invest_agent/html'
 --cov-report xml:'../coverage/invest_agent/coverage.xml'
 --html='../reports/invest_agent/unittests/html/index.html'
 --junitxml='../reports/invest_agent/unittests/junit.xml'
"""

[tool.poetry]
name = "invest_agent"
version = "0.0.1"
description = "🧺 coinbasket invest agent"
authors = [ "mehdidotcafe" ]
license = "Proprietary"
readme = "README.md"

  [[tool.poetry.packages]]
  include = "invest_agent"

  [tool.poetry.dependencies]
  python = ">=3.10,<4.0"
  uagents = ">=0.22.4,<0.23.0"
  python-dotenv = ">=1.1.0,<2.0.0"
  langchain-openai = "^0.3.29"
  langchain-core = "^0.3.74"
  langgraph = "^0.6.4"
  jq = ">=1.8.0,<2.0.0"
  web3 = ">=7.10.0,<8.0.0"
  environs = ">=14.1.1,<15.0.0"
  uniswap-universal-router-decoder = ">=2.0.0,<3.0.0"
  jsonpickle = ">=4.0.5,<5.0.0"
  langgraph-checkpoint-sqlite = "^2.0.11"
  aiosqlite = "^0.21.0"
  anyio = "^4.9.0"
  aiohttp = "^3.11.18"
  pydantic = "^2.11.5"
  apispec = "^6.8.2"
  async-lru = "^2.0.5"
  sqlalchemy = "^2.0.41"
  alembic = "^1.16.4"
  asyncpg = "^0.30.0"
  psycopg2-binary = "^2.9.10"
  temporalio = "^1.18.1"

    [tool.poetry.dependencies.langchain]
    extras = [ "openapi" ]
    version = "^0.3.25"

    [tool.poetry.dependencies.protocol]
    path = "../protocol"
    develop = true

    [tool.poetry.dependencies.shared]
    path = "../shared"
    develop = true

[tool.poetry.group.dev.dependencies]
eth-typing = "^5.2.1"
ruff = ">=0.11.4,<0.12.0"
syrupy = "^4.9.1"
pytest = "8.3.5"
pytest-sugar = "1.0.0"
pytest-cov = "6.0.0"
pytest-html = "4.1.1"
pytest-watch = "4.2.0"
pytest-asyncio = "^1.0.0"

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
