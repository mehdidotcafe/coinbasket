name: coinbasket_invest_agent_production
services:
  postgres_production:
    image: postgres:17.5
    container_name: postgres_production
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${AGENT_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  temporal_production:
    depends_on:
      - postgres_production
    container_name: temporal_production
    image: temporalio/auto-setup:1.29
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres_production
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PWD=${DATABASE_PASSWORD}
      - DBNAME=${AGENT_NAME}-temporal
      - VISIBILITY_DBNAME=${AGENT_NAME}-temporal-visibility
    ports:
      - "${TEMPORAL_PORT}:7233"
      - "8889:8233"
    volumes:
      - temporal-data:/tmp/temporal
volumes:
  postgres-data:
  temporal-data: